<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dice Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
  --felt:light-dark(#a3192b,#3d0b14);--felt2:light-dark(#8a1424,#2c070e);
  --card:light-dark(#fbf6ec,#21171a);--ink:light-dark(#1d1416,#f5ede4);--soft:light-dark(#6b5a5c,#b9a8a6);
  --line:light-dark(#e6dccb,#3a2a2d);--gold:#ffc531;--on:light-dark(#fff,#f5ede4)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--felt),var(--felt2));background-attachment:fixed;color:var(--on);font:16px/1.5 Rubik,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:36px max(4vw,16px) 48px}
h1{margin:0 0 6px;font-weight:900;font-size:clamp(38px,8vw,60px);line-height:1.05}
.sub{margin:0 0 28px;opacity:.85;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
a.game{display:flex;gap:18px;align-items:center;background:var(--card);color:var(--ink);text-decoration:none;border-radius:22px;padding:20px;box-shadow:0 10px 24px rgb(0 0 0/.28),inset 0 -3px 0 var(--line);transition:transform .15s}
a.game:hover{transform:translateY(-3px)}
a.game:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
a.game svg{width:68px;height:68px;flex:none}
a.game b{display:block;font-size:26px;font-weight:900;line-height:1.1}
a.game span{color:var(--soft);font-size:15px}
.note{margin-top:28px;font-size:14px;opacity:.75}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dice Games</h1>
  <p class="sub">Score counters for the table. Pick a game.</p>
  <div class="grid">
    <a class="game" href="5000.html">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="3" y="5" width="40" height="40" rx="9" fill="#00000033"/><rect x="4" y="2" width="40" height="40" rx="9" fill="#fbf6ec" stroke="#e6dccb"/><g fill="#a3192b"><circle cx="14" cy="12" r="4"/><circle cx="34" cy="12" r="4"/><circle cx="24" cy="22" r="4"/><circle cx="14" cy="32" r="4"/><circle cx="34" cy="32" r="4"/></g></svg>
      <div><b>5000</b><span>First to the target wins. +50, +100, +1000 buttons.</span></div>
    </a>
    <a class="game" href="yatzy.html">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="3" y="5" width="40" height="40" rx="9" fill="#00000033"/><rect x="4" y="2" width="40" height="40" rx="9" fill="#fbf6ec" stroke="#e6dccb"/><g fill="#14613f"><circle cx="14" cy="11" r="3.6"/><circle cx="34" cy="11" r="3.6"/><circle cx="14" cy="22" r="3.6"/><circle cx="34" cy="22" r="3.6"/><circle cx="14" cy="33" r="3.6"/><circle cx="34" cy="33" r="3.6"/></g></svg>
      <div><b>Yatzy</b><span>15-box score sheet that adds up for you.</span></div>
    </a>
  </div>
  <p class="note">Players and scores are saved on this device.</p>
</div>
</body>
</html>
